AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Private two-person love-letter archive

Parameters:
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact frontend origin, without a trailing slash.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Architectures: [x86_64]

Resources:
  PrivateSiteApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 600
      Auth:
        Authorizers:
          PrivateAuth:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${PrivateUserPool}
              audience: [!Ref PrivateUserPoolClient]

  PrivateUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: our-always-private
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

  PrivateUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: our-always-web
      UserPoolId: !Ref PrivateUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  OwnersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Owners
      Description: The owner account may add letters and photos.
      UserPoolId: !Ref PrivateUserPool

  ContentTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  PrivateMediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref FrontendOrigin]
            AllowedMethods: [GET, PUT, HEAD]
            AllowedHeaders: ['*']
            MaxAge: 3600
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: our-always-web-oac
        Description: CloudFront access to the private static-site bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: StaticSite
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: StaticSite
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  PrivateSiteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: backend
      DockerTag: go1.26
    Properties:
      PackageType: Image
      Environment:
        Variables:
          CONTENT_TABLE: !Ref ContentTable
          MEDIA_BUCKET: !Ref PrivateMediaBucket
          FRONTEND_ORIGIN: !Ref FrontendOrigin
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref ContentTable
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub ${PrivateMediaBucket.Arn}/*
      Events:
        ListContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref PrivateSiteApi
            Path: /content
            Method: GET
            Auth:
              Authorizer: PrivateAuth
        CreateContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref PrivateSiteApi
            Path: /content
            Method: POST
            Auth:
              Authorizer: PrivateAuth
        CreateUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref PrivateSiteApi
            Path: /media/upload-url
            Method: POST
            Auth:
              Authorizer: PrivateAuth

Outputs:
  ApiUrl:
    Description: Private content API base URL.
    Value: !Sub https://${PrivateSiteApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  UserPoolId:
    Value: !Ref PrivateUserPool
  UserPoolClientId:
    Value: !Ref PrivateUserPoolClient
  WebBucketName:
    Value: !Ref WebBucket
  WebsiteUrl:
    Description: CloudFront site URL.
    Value: !Sub https://${WebDistribution.DomainName}
  WebDistributionId:
    Value: !Ref WebDistribution
  OwnersGroupName:
    Value: !Ref OwnersGroup